<table role="presentation" style="width:100%">
  <tr>
    <td>
      <p class="greeting">{{greeting}}</p>
      <p class="text">{{message}}</p>

      <div class="warning">
        <p class="warning-title">{{warningTitle}}</p>
        <p class="warning-text">{{warningBody}}</p>
      </div>

      <table role="presentation" style="background:#f4f4f5;border-radius:8px;padding:16px;margin:16px 0;width:100%">
        <tr>
          <td style="padding:4px 0;font-size:14px;color:#71717a">{{detailLabel}}</td>
        </tr>
        <tr>
          <td style="padding:4px 0;font-size:14px;color:#171717;font-weight:500">{{detailValue}}</td>
        </tr>
      </table>

      <p class="text" style="font-size:14px;margin-top:24px">{{footerNote}}</p>
    </td>
  </tr>
</table>
